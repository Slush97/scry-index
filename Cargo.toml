[package]
name = "scry-index"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
authors = ["slush97"]
license = "MIT OR Apache-2.0"
description = "A concurrent sorted key-value map backed by learned index structures"
repository = "https://github.com/slush97/scry-index"
keywords = ["learned-index", "concurrent", "sorted-map", "data-structure"]
categories = ["data-structures", "concurrency"]
publish = false

[dependencies]
# Phase 2 will add: crossbeam-epoch, crossbeam-utils

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
rand_distr = "0.4"

[[bench]]
name = "lookup"
harness = false

[[bench]]
name = "insert"
harness = false

[lints.rust]
missing_docs = "warn"
unreachable_pub = "allow"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Intentional allows
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
many_single_char_names = "allow"
redundant_pub_crate = "allow"
into_iter_without_iter = "allow"
missing_const_for_fn = "allow"
suboptimal_flops = "allow"
cast_lossless = "allow"
