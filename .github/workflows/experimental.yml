name: Experimental

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  sanitizer:
    name: Thread Sanitizer
    runs-on: ubuntu-latest
    # The TSan race between UnsafeCell reads and cas_tombstone_to_data was
    # fixed by replacing inline tombstone reuse with child-node attachment
    # (cas_tombstone_to_child_stale). Inline slot data is now write-once.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly test --lib --tests -Zbuild-std --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=thread -Dwarnings -Cunsafe-allow-abi-mismatch=sanitizer
          RUST_TEST_THREADS: 1

  fuzz-smoke:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - run: cargo +nightly fuzz run fuzz_operations -- -max_total_time=30 -rss_limit_mb=512
      - run: cargo +nightly fuzz run fuzz_bulk_load -- -max_total_time=30 -rss_limit_mb=512
      - run: cargo +nightly fuzz run fuzz_string_keys -- -max_total_time=30 -rss_limit_mb=512
