name: Experimental

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  sanitizer:
    name: Thread Sanitizer
    runs-on: ubuntu-latest
    # TSan reports a real-but-benign race between UnsafeCell reads (after
    # loading state=DATA) and concurrent writes (cas_tombstone_to_data).
    # Aligned word reads/writes are atomic on x86 and ARM, and all CAS
    # operations that depend on the read will fail-and-retry if the state
    # changed. Fixing requires atomic key/value storage or per-slot locks.
    # See node.rs read_key() safety docs for details.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=thread -Dwarnings
          RUST_TEST_THREADS: 1

  fuzz-smoke:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - run: cargo +nightly fuzz run fuzz_operations -- -max_total_time=30 -rss_limit_mb=512
      - run: cargo +nightly fuzz run fuzz_bulk_load -- -max_total_time=30 -rss_limit_mb=512
      - run: cargo +nightly fuzz run fuzz_string_keys -- -max_total_time=30 -rss_limit_mb=512
